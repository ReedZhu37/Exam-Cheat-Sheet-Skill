[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exam-cheat-sheet"
version = "0.1.0"
description = "Provenance-aware, split-isolated exam material ingestion"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5",
  "pypdfium2>=4.30",
  "pillow>=10",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "jsonschema>=4.23",
  "reportlab>=4.2",
  "fonttools>=4.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/exam_cheat_sheet"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "exam_cheat_sheet/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
